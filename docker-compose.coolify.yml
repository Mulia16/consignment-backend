# Docker Compose untuk deployment Coolify (staging).
#
# Perbedaan dari docker-compose.yml (untuk lokal):
# - Tidak mem-publish port ke host; akses publik hanya lewat domain proxy Coolify
#   pada service api-gateway (port container 8080).
# - Tanpa definisi network manual; Coolify membuat network khusus per resource,
#   dan service saling terhubung lewat nama service.
# - Service database (postgres, mongodb) tidak diekspos ke luar.
#
# Domain di Coolify diatur untuk service: api-gateway
# Contoh: https://consignment.coolify.staging.folieatrois.co:8080
services:
  service-registry:
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    restart: unless-stopped
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  consignment-service:
    build:
      context: .
      dockerfile: consignment-service/Dockerfile
    restart: unless-stopped
    depends_on:
      service-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka
      - DB_URL=jdbc:postgresql://postgres:5432/consignment_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - MONGODB_URI=mongodb://mongodb:27017/consignment_logs
      - QUEUE_ENABLED=${QUEUE_ENABLED:-false}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - API_LOG_ENABLED=true
      - SECURITY_ENABLED=true
      - APP_SECURITY_ENABLED=true
      - JWT_SECRET=consignment-secret-key-must-be-at-least-32-chars
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    depends_on:
      service-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka
      - DB_URL=jdbc:postgresql://postgres:5432/consignment_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=consignment-secret-key-must-be-at-least-32-chars
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  email-service:
    build:
      context: .
      dockerfile: email-service/Dockerfile
    restart: unless-stopped
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  batch-job-service:
    build:
      context: .
      dockerfile: batch-job-service/Dockerfile
    restart: unless-stopped
    depends_on:
      service-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka
      - DB_URL=jdbc:postgresql://postgres:5432/consignment_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=consignment_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=consignment_logs
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:
